project:
  type: website
  output-dir: _build

# lightbox: true
filters:
- interlinks
- filters.lua
- quarto
- quarto-pdb

lightbox: true

website:
  title: "Molecular Nodes"
  google-analytics: G-W3K8TDXSCF
  page-navigation: true

  navbar:
    left:
    - href: tutorials/index.qmd
      text: Documentation
    - href: nodes/index.qmd
      text: Nodes
    - text: API
      href: api/
    - text: Changelog
      href: changelog.qmd
    - href: examples/
      text: Examples
    - href: citations/
      text: Citations
    tools:
    - icon: github
      href: https://github.com/BradyAJohnston/MolecularNodes
    - icon: twitter
      href: https://twitter.com/bradyajohnston
    - icon: youtube
      href: https://youtube.com/c/bradyjohnston

  sidebar:
  # -- begin generated nodes sidebar (docs/generate.py) --
  - id: nodes
    collapse-level: 2
    contents:
    - href: nodes/index.qmd
      text: Overview
    - href: nodes/materials.qmd
      text: Materials
    - href: nodes/general.qmd
      text: General
    - href: nodes/animate.qmd
      text: Animate
    - href: nodes/attributes.qmd
      text: Attributes
    - href: nodes/color.qmd
      text: Color
    - href: nodes/curves.qmd
      text: Curves
    - href: nodes/dna.qmd
      text: DNA
    - href: nodes/density.qmd
      text: Density
    - href: nodes/ensemble.qmd
      text: Ensemble
    - href: nodes/geometry.qmd
      text: Geometry
    - href: nodes/select.qmd
      text: Select
    - href: nodes/style.qmd
      text: Style
    - href: nodes/topology.qmd
      text: Topology
    - href: nodes/utilities.qmd
      text: Utilities
    - href: nodes/utilities_attribute.qmd
      text: Utilities / Attribute
    - href: nodes/utilities_boolean.qmd
      text: Utilities / Boolean
    - href: nodes/utilities_color.qmd
      text: Utilities / Color
    - href: nodes/utilities_fields.qmd
      text: Utilities / Fields
    - href: nodes/generated_nodes.qmd
      text: Generated Node Groups
  # -- end generated nodes sidebar --
  - id: attributes
    contents:
    - section: "Tutorials"
      contents:
      - tutorials/index.qmd
      - tutorials/installation.qmd
      - tutorials/interface.qmd
      - tutorials/importing.qmd
      - tutorials/selections.qmd
      - tutorials/trajectories.qmd
      - tutorials/streaming-trajectories.qmd
      - tutorials/cryoem.qmd
      - tutorials/simulation.qmd
    - section: "Reference"
      contents:
      - attributes.qmd
      - data_table.qmd

  page-footer:
    left: "This site is built with ❤️ and [Quarto](https://quarto.org/)."
    # background: "#F8F9FA"

format:
  html:
    # page-layout: full
    theme:
    - darkly
    - style.scss
    include-in-header: shiki.html

    toc: true
    toc-depth: 3
    preview-colour:
      code: true
      text: true

metadata-files:
- api/_sidebar.yml

interlinks:
  aliases:
    numpy: np
    molecularnodes: mn
    MDAnalysis: mda
  sources:
    numpy:
      url: https://numpy.org/doc/stable/
    python:
      url: https://docs.python.org/3/
    biotite:
      url: https://www.biotite-python.org/latest/
    MDAnalysis:
      url: https://docs.mdanalysis.org/stable/
    bpy:
      url: file://objects_inv/bpy/

quartodoc:
  package: molecularnodes
  dir: api/reference
  render_interlinks: true
  renderer:
    style: _renderer.py

  sidebar:
    file: api/_sidebar.yml
    search: true
    collapse-level: 2
    contents:
    - text: Introduction
      href: api/index.qmd
    - text: "---"
    - section: "Guides"
      contents:
      - api/styles.qmd
      - api/trajectories.qmd
      - api/nodebpy.qmd
      - api/rendering.qmd
      - api/materials.qmd
      # - api/density.qmd
      - api/annotations.qmd
      - api/solvent.qmd
      - api/canvas.qmd
      - api/blender.qmd
    - text: "---"
    - section: "Reference"
      contents:
      - "{{ contents }}"
  # css: api/_styles-quartodoc.css

  options:
    include_inherited: true

  sections:
  - title: Molecule
    desc: >
      The unified `Molecule` entity and its facets. A `Molecule` represents any structure — static or trajectory — backed by an `MDAnalysis.Universe`.
    contents:
    - Molecule
    - entities.molecule.SelectionManager
    - entities.molecule.DSSPManager
    - entities.StreamingTrajectory

  - title: Other Entities
    desc: Additional molecular entities for ensembles and coarse-grained models
    contents:
    - entities.Ensemble
    - entities.OXDNA

  - title: Materials
    desc: The pre-built materials and their tweakable parameters
    contents:
    - material.Default
    - material.AmbientOcclusion
    - material.Flat
    - material.Squishy
    - material.TransparentOutline
    - material.PresetMaterial
    - material.append_material
    - material.add_all_materials

  - title: Session
    desc: Session object to control molecular entities
    contents:
    - session.MNSession

  - title: Annotations
    desc: Annotations for molecular entitites
    contents:
    - annotations.base
    - annotations.interface
    - annotations.manager
    - entities.molecule.annotations
    - entities.density.annotations

  - title: Scene
    desc: Control settings for the Blender scene through the `Canvas` object.
    contents:
    - Canvas
    - scene.camera
    - scene.compositor.CompositorTree
    - scene.recorder.FrameRecorder
    - scene.world.WorldTree

  # -- begin generated node sections (docs/generate.py) --
  - title: Nodes
