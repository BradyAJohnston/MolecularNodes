# Extra documentation for the nodes included in Molecular Nodes, keyed by the
# node group's name in molecularnodes/assets/node_data_file.blend.
#
# The .blend file (via its node/socket descriptions and asset catalogs) is the
# source of truth for everything structural; this file only holds what cannot
# live on the nodes themselves: long-form prose and demo videos.
# Used by docs/generate.py when building the documentation.
#
# Entries marked `custom: true` describe the per-entity node groups that are
# generated on import (e.g. chain / entity selections) rather than assets in
# the .blend file; they carry their own `category`.

Style Spheres:
  description: >-
    Space filling atomic spheres scaled based on their `vdw_radii` attribute.  By default they are _Point Clouds_
    which render as simple primitives inside of EEVEE but perfect spheres inside of Cycles.  To
    show the atoms inside of EEVEE you can choose the `Instance::Menu` or `Mesh::Menu` as the sphere type, which will
    generate traditional polygonal geometry for rendering in EEVEE.
  videos:
    - https://imgur.com/eRDo2As
Style Cartoon:
  description: >-
    Peptide helices and sheets are emphasized with the 'traditional' cartoon style. Secondary structure becomes
    distinct and nucleic acids become a simplified representation. The node also includes an option to calculate
    secondary structure by enabling the `Topology DSSP::Node` input, but this will differ to secondary structure imported from
    structures from the PDB.
  videos:
    - https://imgur.com/jFdzd5J
Style Ribbon:
  description: >-
    A simplified tube that through the alpha carbons of the protein. Controls for the raadius and smoothing of sheets
    are available.
  videos:
    - https://imgur.com/LROZR8i
Style Surface:
  description: >-
    The `vdw_radii` and a probe are used to calculate the surface of the molecule. This is still a close approximation
    of other surface generation algorithms and won't match those made by PyMol and ChimeraX exactly. Coloring of
    the surface is by default done by sampling the closest alpha carbon, but this can be disabled to use the closest
    atom for coloring the mesh
  videos:
    - https://imgur.com/GM8TYZm
Style Ball and Stick:
  description: >-
    Shows the atoms and bonds. The bonds are cylinders between the atoms, which can be split apart for double and
    triple bonds if the information is within the structure on import. Spheres can be displayed as mesh of as _Point
    Cloud_ as with the `Style Spheres::Node` node. Bonds can also be calculated if none are present, but this is approximate
    and purely distance based so should not be relied upon
  videos:
    - https://imgur.com/nXPQN7W
Style Sticks:
  description: >-
    Each bond terminates cleanly in a half sphere for a typical stick representation of the atoms and bonds
  videos:
    - https://imgur.com/iNqE87M
Separate Atoms:
  description: >-
    Separate the input atoms into the `Atoms::Geometry` and `Inverted::Geometry` based on the input `Selection::Bool`. For simply styling this
    can the same as inputting the `Selection::Bool` directly into the Style node. The one additional output for this node
    is the `Index::Int` field, which is the index of the atom in the original structure before the selection happened
    and potentially changed it's index
  videos:
    - https://imgur.com/OAcekhf
Separate Polymers:
  description: >-
    Separate the input atomic geometry into it's different polymers or `Protein`, `Nucleic Acid` and `other`.
  videos:
    - https://imgur.com/trg0voP
Select Chain_:
  description: >-
    Select single or multiple of the different chains. Creates a selection based on the `chain_id` attribute.
  videos:
    - https://imgur.com/U7HqDct
  custom: true
  label: Chain
  category: Select
Select Entity_:
  description: >-
    Select single or multiple of the different entities. Creates a selection based on the `entity_id` attribute.
  videos:
    - https://imgur.com/h5KZBXt
  custom: true
  label: Entity
  category: Select
Select Segment_:
  description: Output a selection based on the `segment_id` that is present in some MD trajectories
  custom: true
  label: Segment
  category: Select
Select Atomic Number:
  description: >-
    Select points based on their `atomic_number` attribute, corresponding to the element's atomic number. Useful
    for selecting single elements quickly
  videos:
    - https://imgur.com/B6V9W3F
Select Element:
  description: >-
    Select points for the first 80 elemnts of the preiodic table, via a boolean input. Elements are grouped into
    panels of 20 each for orgnaisation and convenience
  videos:
    - https://imgur.com/d6Q3T7D
Select Res Name:
  description: >-
    Select points based on their `res_id` attribute for different peptide or nucleic acid residue names. Inputs
    are arranged alphabetically and in panels of _Protein_, _RNA_ and _DNA_ for layout
  videos:
    - https://imgur.com/smwnKsL
Select Res ID:
  description: Select a atoms based on their `res_id` number.
  videos:
    - https://imgur.com/BL6AOP4
Select Res ID Range:
  description: >-
    Select multiple residues by specifying a `Min::Int` and a `Max::Int`, defining a range that includes or excludes based
    on the `res_id` number.
  videos:
    - https://imgur.com/NdoQcdE
Select Nucleic Type:
  description: Select either purines or pyrimidines
Select Attribute:
  description: Select atoms that have true for the given attribute name.
Is Peptide:
  description: Outputs a selection for all of the points in a peptide
  videos:
    - https://imgur.com/KGU2ElV
Is Nucleic:
  description: Outputs a selection for all of the points in a nucleic acid molecule
  videos:
    - https://imgur.com/UBVBPnI
Is Lipid:
  description: Select the atoms involved in lipid molecules.
Is Solvent:
  description: Select the atoms that are part of the solvent.
Is Hydrogen:
  description: Outputs a selection for all of the hydrogen atoms in the structure
Is Alpha Carbon:
  description: Outputs a selection for all of the points that are alpha carbons (CA) in the structure
  videos:
    - https://imgur.com/JxGa9Ou
Is Backbone:
  description: >-
    Outputs a selection for the backbone atoms of a peptide or nucleic acid polymer. Peptide backbone includes the
    peptide oxygen and the alpha carbon as part of the backbone
  videos:
    - https://imgur.com/MBpgktt
Is Side Chain:
  description: >-
    Outputs a selection for the side chain atoms of a peptide or nucleic acid polymer. Peptide side chain can optionally
    include or exclude the alpha carbon CA of the side chain
  videos:
    - https://imgur.com/Hpy5AQc
Is Helix:
  description: >-
    Outputs a selection for points that are part of a helix. The `sec_struct` attribute must exist, either imported
    from the file or computed with the `Topology DSSP::Node` node
  videos:
    - https://imgur.com/Rp2CPvq
Is Sheet:
  description: >-
    Outputs a selection for points that are part of a sheet. The `sec_struct` attribute must exist, either import
    from the file or computed with the `Topology DSSP::Node` node
  videos:
    - https://imgur.com/OObFAzq
Is Loop:
  description: >-
    Outputs a selection for those points in a peptide which are not part of any secondary structure (loop or helix)
  videos:
    - https://imgur.com/Buy0OEu
Select Bonded:
  description: >-
    Based on an initial selection, finds atoms which are within a certain number of bonds of this selection. Output
    can include or excluded the original selection.
  videos:
    - https://imgur.com/g8hgXup
Select Res Whole:
  description: >-
    Expand the given selection to include a whole residue, if a single atom in that residue is selected. Useful
    for when a distance or proximity selection includes some of the residue and you wish to include all of the residue.
  videos:
    - https://imgur.com/JFzwE0i
Select Cube:
  description: >-
    Create a selection that is inside the `Empty_Cube` object. When this node is first created, an _empty_ object
    called `Empty_Cube` should be created. You can always create additional empty objects through the add menu,
    to use a different object. The rotation and scale of the object will be taken into account for the selection.
  videos:
    - https://imgur.com/P4GZ7vq
Select Sphere:
  description: >-
    Create a selection that is within a spherical radius of an object, based on that object's scale. By default
    an _empty_ object called `Empty_Sphere` is created. You can use other objects or create a new empty to use.
    The origin point for the object will be used, which should be taken in to account when using molecules. Use
    `Select Proximity::Node` node for selections which are within a certain distance of a selection
    of atoms instead of a single origin point.
  videos:
    - https://imgur.com/xdeTZR7
Select Proximity:
  description: >-
    Create a selection based on the proximity to the Target Atoms of the input. A sub-selection of the Target atoms
    can be used if the `Subset` input is used. You can expand the selection to include an entire residue if a single
    atom in that residue is selected, by setting `Expand::Bool` to `True`. In the example below, the `Style Spheres::Node` is
    being applied to a selection, which is being calculated from the proximity of atoms to specific chains. As the
    cutoff for the selection is changed, it includes or excludes more atoms. The `Whole Residue` option also ensures
    that entire residues are shown.
  videos:
    - https://imgur.com/QmvDZn2
Set Color:
  description: >-
    Set the `Color` attribute on the point domain, based on the input `Color::Color` field. The `Selection::Bool` field limits
    the setting of the color to the input `Selection::Bool`, with the unselected points keeping their current `Color`
    attribute
  videos:
    - https://imgur.com/1vTKUom
Color Chain_:
  description: >-
    Pick colors that are used for each `chain_id` that is present in the structure. The inputs can also accept fields
    to generate colors for that chain based on upstream field evaluation. This node is generated on a per-structure
    basis, so will only be useful for the corresponding structure.
  videos:
    - https://imgur.com/F6f8MQW
  custom: true
  label: Chain
  category: Color
Color Segment_:
  custom: true
  label: Segment
  category: Color
Color Entity_:
  description: >-
    Choose the colors for the individual entities in the structure. If there are multiple copies of the same protein
    or molecule in the structure but in different conformations, it can helpt to color them based on their `entity_id`
    rather than individual `chain_id` values
  videos:
    - https://imgur.com/dqa9Jro
    - https://imgur.com/EMmQsEP
  custom: true
  label: Entity
  category: Color
Color Element:
  description: >-
    Choose colors for the individual elements of the periodic table. The first 80 elements are listed, grouped into
    panels in chunks of 20 elements per panel for better organisation.
  videos:
    - https://imgur.com/MHjCHJd
Color Atomic Number:
  description: >-
    Choose the color for an individual `atomic_number`. Useful for joining with fields and selecting individual
    elements for coloring
  videos:
    - https://imgur.com/tErqBNb
Color Res Name:
  description: Choose colors for the individual amino acid and nucleic acid residues
  videos:
    - https://imgur.com/7bEmJGU
Color Common:
  description: For convenience, choose colors for the common 6 elements found protein structures
  videos:
    - https://imgur.com/JZD0IvD
Color Goodsell:
  description: Darken the color of non-carbon atoms, a similar strategy to the style developed by David Goodsell
  videos:
    - https://imgur.com/RDykyT3
Color Rainbow:
  description: >-
    Output a rainbow color spectrum along the structure. The rainbow can be generated along each chain in the structure,
    or along the entire structure. You can offset the strat of the rainbow and chain the color & satuation of the
    generated colors
  videos:
    - https://imgur.com/8fYEqQn
Color Attribute Map:
  description: >-
    Map a value to interpolate between two colors, optionally using an intermediate color. User can specify the
    _Attribute Name_ that is used for the inerpolation, specifying the start and end values of the interpolation
  videos:
    - https://imgur.com/ZWCSx19
Color Attribute Random:
  description: >-
    Generate a random color, based on the given attribute. Control the lightness and saturation of the color with
    the inputs.
  videos:
    - https://imgur.com/5sMcpAu
Color pLDDT:
  description: >-
    Uses the `b_factor` attribute to assign the typical AlphaFold `pLDDT` color palette. Node is automatically used
    when fetching directly from the AlphaFold database
  videos:
    - https://imgur.com/3RAi1rm
Color Backbone:
  description: >-
    Select colors for atoms that are part of the backbone or the side chain of a peptide or nucleic acid polymer.
    Atoms that are neither maintain their current `Color` attribute
  videos:
    - https://imgur.com/nadPkJd
Color Mix Intermediate:
  description: >-
    Mix between two colors, potentially via an intermediate color. Use either linear or OKLab color spaces
Color OKLab Mix:
  description: >-
    Mix two colors together using the OKLab color space. The first color is the base color, and the second color
    is the color to mix in. The mix is done in the OKLab color space, and then converted back to linear RGB color
    space.
Color OKLab Offset:
  description: >-
    Offset a color's luminance or hue in the OKLab color space. The offset is applied to the luminance or hue of
    the color.
Color to OKLab:
  description: >-
    Convert linear RGB color to OKLab color space. This is useful for converting a color to a color that is perceptually
    uniform.
OKLab to Color:
  description: Convert OKLab color to linear RGB color.
OKLab to LCh:
  description: >-
    Convert OKLab color to LCh color space. This is useful for converting a color to a color that is perceptually
    uniform.
LCh to OKLab:
  description: >-
    Convert LCh color to OKLab color space. This is useful for converting a color to a color that is perceptually
    uniform.
OKLab Offset LCh:
  description: >-
    Offset the lightness and chroma of an OKLab color. It is first converted to LCh color space, then the lightness
    and chroma are offset, then converted back to OKLab color space.
Chain ID:
  description: >-
    The 'chain_id' attribute, an integer representation of the Chain IDs from the structure. Chains are sorted alphabetically
    then assigned an ID startin at `0` and increasing.
Atom ID:
  description: >-
    The `atom_id` attribute which is read from the file. Will be increasing linearly for each subsequent atom
Entity ID:
  description: The `entity_id` attribute of the point
Residue ID:
  description: >-
    The `residue_id` attribute of the point, which is the assigned number of the residue inside the chain of the
    structure
Atomic Number:
  description: The `atomic_number` attribute, ascending from `1` for each element on the periodic table
Atom Name:
  description: >-
    The `atom_name` attribute, an integer representation of the atom names such as C for carbon, CA for alpha carbon
Residue Name:
  description: >-
    The `res_name` attribute, an integer representation of the residue names. Amino acids are sorted alphabetically
    and assigned a value starting at `0`. DNA starts at 30 and RNA starts at 40. Check the [attributes](../attributes.qmd) for a full listing.
Secondary Structure:
  description: The `sec_struct` attribute of the point. `0` is non-peptide, 1 is helix, 2 is sheet and 3 is loop
VDW Radii:
  description: >-
    The `vdw_radii` attribute of the point, corresponding the radius of the element as defined in the data dictionary.
    Used for scaling sphers for `Style Spheres::Node` and `Style Ball and Stick::Node` nodes, and for calculating the surface of the molecule in `Style Surface::Node`
Mass:
  description: The `mass` attribute of the point, used for centre of mass calculations
B Factor:
  description: The `b_factor` attribute of the point, how well resolved the individual atoms are
Color:
  description: >-
    The `Color` attribute of the point, used for coloring the final generated geometry inside of the materials
URes ID:
  description: >-
    The `ures_id` attribute of the point, a unique identifier for each residue across the whole structure that is computed when the structure is loaded.
Residue Parameter:
  description: Read information about the atoms with the context of each residue the atom is in
Chain Parameter:
  description: Read information about the residues within the context of each chain
Structure Parameter:
  description: Read information about the atoms with the context of the whole structure
Unique Residue ID:
  description: A unique Group ID that is calculated for every residue in the structure
Unique Chain ID:
  description: >-
    Assumes only CA points in the geometry. Unique `Group ID::Int` for each chain, incrementing if distance between CA
    points are greater than threshold
Topology DSSP:
  description: Calculate the secondary structure of a structure, storing it on the `sec_struct` attribute.
Dihedral Phi: {}
Dihedral Psi: {}
Dihedral Chi Angle: {}
Dihedral Nucleic Angle: {}
Residue Mask:
  description: >-
    Returns the index for the atom for each unique group (from res_id) for each point in that group. Allows for
    example, all atoms in a group to be rotated around the position of the selected atom. In the video example,
    the `atom_name` is used to select an atom within the groups. Each atom's position is then offset to that position,
    showing the group-wise selection.
  videos:
    - https://imgur.com/sD3jRTR
Menu Residue Mask:
  description: >-
    Returns the index for the atom for each unique group (from res_id) for each point in that group. Allows for
    example, all atoms in a group to be rotated around the position of the selected atom. In the video example,
    the `atom_name` is used to select an atom within the groups. Each atom's position is then offset to that position,
    showing the group-wise selection.
  videos:
    - https://imgur.com/sD3jRTR
Menu Residue Name: {}
Menu Atom Name: {}
Backbone Positions:
  description: >-
    If the atoms have been through the "Compute Backbone" node, then the backbone atom positions will be available
    as attributes through this node. In the video example, the `Alpha Carbons` output is styled as spheres, where
    the position is mixed with some of the backbone posiitons. The backbone positions can also be selected from
    the AA residue higher or lower with the specified offset.
  videos:
    - https://imgur.com/6X2wnpY
Peptide Dihedral:
  description: >-
    Rotate the atoms cumulatively for each residue, adjusting the `phi` and `psi` angles for the selected residues
Peptide Chi:
  description: Rotate the Chi angles for amino acid side chains
Nucleic Dihedral:
  description: Rotate the dihedral angles for nucleic acid backbone
Nucleic Chi:
  description: Rotate the Chi angles for nucleic acid side chains
Set Phi Psi Angle: {}
Set Nucleic Dihedral: {}
Set Chi Angle: {}
Backbone N: {}
Backbone CA: {}
Backbone C: {}
Backbone O: {}
Backbone NH: {}
Set URes ID: {}
Backbone Vectors:
  description: Calculate `Normal`, `Tangent` and `Bitangent` values from protein backbone atom positions
Edge Group ID:
  description: Check if both vertices of an edge are in the same `Group ID`.
Is Backbone Edge:
  description: If both vertices of an edge are an alpha carbon and the edge is part of the same `chain_id`.
Find Bonded Atom: {}
Bond Count:
  description: The number of bonds for an atom
Edge Info:
  description: >-
    Get information for the selected edge, evaluated on the point domain. The "Edge Index" selects the edge from
    all possible connected edges. Edges are unfortunately stored somewhat randomly. The resulting information is
    between the evaluating point and the point that the edge is between. Point Index returns -1 if not connected.
    In the video example, cones are instanced on each point where the Edge Index returns a valid connection. The
    Edge Vector can be used to align the instanced cone along that edge. The length of the edge can be used to scale
    the cone to the other point. As the "Edge Index" is changed, the selected edge changes. When "Edge Index" ==
    3, only the atoms with 4 connections are selected, which in this model (1BNA) are just the phosphates.
  videos:
    - https://imgur.com/Ykyis3e
Point Edge Angle:
  description: >-
    Calculate the angle between two edges, selected with the edge indices. For molecule bonds, combinations of [(0,
    1), (0, 2), (0, 3), (1, 2), (1, 3), (2, 3)] will select all possible bond angles. In the video example, two
    edges are selected with their "Edge Index" values. Those atoms which aren't valid return false and do not get
    instanced. The two edge vectors are used to calculate the perpendicular vector through cross product, around
    which the rotation for the cone is rotated. This demonstrates the ability to calculate the edge angle between
    the two selected edges.
  videos:
    - https://imgur.com/oQP6Cv8
Points of Edge:
  description: >-
    Finds the conntected point for the selected "Edge Index", and returns each point index for all of the points
    connected to that point. If the connection doesn't exist, or the connection is back to the original point, -1
    is returned. In the video example, a new point is selected based on the "Edge Index". At that point, all of
    the connecting points are exposed as indices `0, 1, 2, 3`. If that index is not a valid point or connection,
    or the point is the same as the original point that is being evaluated, then -1 is returned. This is one of
    the more complicated topology nodes, but allows indexing of the atoms that are bonded to a bonded atom. This
    helps with doing calculations for planar molecules.
  videos:
    - https://imgur.com/fZ6srIS
Curve Vectors:
  description: "Vectors relevant to orientations on a curve: Normal, Tangent and Bitangent"
Curve Offset Dihedral:
  description: >-
    Calculate the Dihredral angle between the current point and another point offset along the curve, using their
    `Normal`s
Curve Transform:
  description: >-
    The transform for the point, combining the `Position` and `Curve Rotation` using `Normal` and `Tangent`
Curve Rotation:
  description: The `Rotation` for the point, using the `Normal` and `Tangent` of the point
Cumulative Length:
  description: >-
    The length of the current point, added onto the cumulative length with all previous splines in the curve
Curve Offset Dot:
  description: >-
    Calculate the dot product of the current point and another, using their `Normal` attributes. Also returns the
    dot producted thresholded for a particular cutoff
Offset Point Along Curve:
  description: >-
    Return the `Factor::Float` or `Length::Float` of a point, when offset an amount of points along their curve. A value of 1.5
    returns the `Factor::Float` / `Length::Float` that is half way between the two points that are +1 and +2 from the current
    `Point Index`, Useful for sampling the same curve, at a different point along the curve. Helps with interpolating
    along a bezier curve without having to evaluate to the intermediate points first
  videos:
    - https://imgur.com/NX6dZXR
    - https://imgur.com/05AmdjU
Curve Endpoint Values:
  description: Integer values for the ends of splines, specifying the start and end sizes
Curve Visualize:
  description: Visualize curves, instancing Gimbals with the resulting curve rotation and positions
  videos:
    - https://imgur.com/KKY7v12
Curve Custom Profile:
  description: >-
    `Curve to Mesh` but with the potential for a custom profile, with fields for custom rotations and scaling along
    the curve while generating the geometry
Split to Centred Instances:
  description: >-
    Same as `Split to Instances`, but with the origin point of the instance being the calculated `Centroid` for
    each `Group ID`. The `Selection` determines the points which contribute to the `Centroid` calculation, but all
    points are still offset and split into their instances
  videos:
    - https://imgur.com/NcHuxsz
Centre on Selection:
  description: >-
    Offsets the input points so that their calculated `Centroid` is on the world origin. If the `Group ID` input
    is used this offset is applied on a per-group basis. If the selection is used, only the selected points contribute
    towards the calculation of the centroid, but all points are still moved
  videos:
    - https://imgur.com/xSOH4Tr
Separate First Point:
  description: Separate out the first point for each group in the `Group ID`
Selected Instances:
  description: Check if instances are selected based on the field (usually based on `Position` attribute)
Slice Edge Instances:
  description: >-
    For position based selections, realise the instances that cross the selection and then separate the selected
    points from within the selection
Primitive Arrow:
  description: A simple arrow geometry
Primitive Gimbal:
  description: A 3-axis gimbal made of `Primitive Arrow`s, useful for visualisation and debugging
Contains Geometry:
  description: Check if a geometry contains geometry in any of the domains
Fallback Geometry:
  description: Fallback geometry for when the input geometry is empty in all domains
Plexus:
  description: Find points that are within a given distance of each other and create an edge between them
Visualize Points: {}
Visualize Angle: {}
Index Mix Float:
  description: >-
    Sample and interpolate the `Float` value between the floor and ceiling of the given `Index`, by the fractional
    amount
Index Mix Vector:
  description: >-
    Sample and interpolate the `Vector` value between the floor and ceiling of the given `Index`, by the fractional
    amount
Index Mix Rotation:
  description: >-
    Sample and interpolate the `Rotation` value between the floor and ceiling of the given `Index`, by the fractional
    amount
Index Mix Color:
  description: >-
    Sample and interpolate the `Color` value between the floor and ceiling of the given `Index`, by the fractional
    amount
Sample Position:
  description: Sample the `Position` attribute from a point at the given `Index`
Sample Mixed Vector:
  description: Sample the `Vector` attribute, mixed between the floor and ceiling of the given `Index`
Sample Mixed Rotation:
  description: Sample the `Rotation` attribute, mixed between the floor and ceiling of the given `Index`
Sample Mixed Color:
  description: Sample the `Color` attribute, mixed between the floor and ceiling of the given `Index`
Offset Index:
  description: Add an integer offset to the point's `Index`
Offset Integer:
  description: Evaluate an `Integer` at an index that is offset by the specified amount
Offset Float:
  description: Evaluate a `Float` value at an index that is offset by the specified amount
Offset Color:
  description: Read the `Color` attribute at an index that is offset by the specified amount
Offset Vector:
  description: Evaluate a `Vector` at an index that is offset by the specified amount
Offset Boolean:
  description: Evaluate a `Boolean` at an index that is offset by the specified amount
Offset Rotation:
  description: Evaluate a `Rotation` at an index that is offset by the specified amount
Offset Matrix:
  description: Evaluate a `4X4 Matrix` at an index that is offset by the specified amount
Fallback Float:
  description: >-
    Use the `Float` attribute specified by name. If the attribute doesn't exist, use the `Fallback` value instead
Fallback Vector:
  description: >-
    Use the `Vector` attribute specified by name. If the attribute doesn't exist, use the `Fallback` value instead
Fallback Integer:
  description: >-
    Use the `Integer` attribute specified by name. If the attribute doesn't exist, use the `Fallback` value instead
Fallback Boolean:
  description: >-
    Use the `Boolean` attribute specified by name. If the attribute doesn't exist, use the `Fallback` value instead
Fallback Color:
  description: >-
    Use the `Color` attribute specified by name. If the attribute doesn't exist, use the `Fallback` value instead
Fallback Rotation:
  description: >-
    Use the `Rotation` attribute specified by name. If the attribute doesn't exist, use the `Fallback` value instead
Fallback Matrix:
  description: >-
    Use the `Matrix` attribute specified by name. If the attribute doesn't exist, use the `Fallback` value instead
Group Info:
  description: Indices of points within each `Group ID`
Sub Group Info:
  description: Indices of points within each `Sub Group ID`, within each `Group ID`
Group Pick:
  description: >-
    For each group, return the index of the point for which the Selection is true. Only valid if there is a single
    true in the group. If not lvalid, returns -1
Group Pick First:
  description: >-
    Similar to `Group Pick`, but will always return `Index` of first true element, even if there are multiple true
    values. If nothing is true then will return `-1`
Group Pick Vector:
  description: >-
    For each group, return the Position of the point at which the selection is true. If there is more than one true
    for the group the pick is not valid and (0, 0, 0) is returned
Relative Index:
  description: >-
    Based on the Group ID input, return the size of the group and the indices of the first and last items of the
    group
Attribute Run:
  description: Fill in gaps in a set of continuous boolean True values, up to a specific size
Boolean First:
  description: For each `Group ID`, every value becomes `False` except the first `True` value
Boolean Last:
  description: >-
    Accumulating on the `Point` domain for each `Group ID`, returns the `Index` where the `Boolean` was last previously
    `True`, excluding the currently evaluating point
Boolean Any:
  description: True for a whole `Group ID` if any value is `True`
Integer Run:
  description: Group mask output increments whenever the input value or the Group ID changes
Boolean Run Fill:
  description: Fill in gaps in a set of continuous boolean True values, up to a specific size
Boolean Run Trim:
  description: >-
    Mask a run of boolean values. Potentially trim the start or ending values and specifying a minimum length under
    which they are considered false
Ensemble Instance:
  description: Instance the items of an ensemble onto the given points
Periodic Array:
  description: Replicate the trajectory across periodic boundaries.
Periodic Box:
  description: >-
    Get the box vectors for a trajectory's periodic simulation box. These vectors can be used to create periodic
    images of the trajectory
Periodic Image:
  description: >-
    Get the location of a single lattice point of the trajectory, based on the box vectors and the chosen lattice
    indices.
Lattice Grid:
  description: Create a grid of lattice points based on the periodic box vectors.
Starfile Instances:
  description: Instance an object onto the given starfile points
Rotation RELION:
  description: A rotation calculated from relevant columns of a RELION .star file
Rotation cisTEM:
  description: A rotation calculated from relevant columns of a cisTEM .star file
Animate Frames:
  description: >-
    Animate the atoms of a structure, based on the frames of a trajectory from the `Frames` collection in the input.
    The structure animates through the trajectory from the given start frame to the given end frame, as the `Animate
    0..1` value moves from `0` to `1`. Values higher than `1` start at the beginning again and the trajectory will
    loop repeating every `1.00`. Position and `b_factor` are interpolated if available. By default linear interpolation
    is used. Smoothing in and out of each frame can be applied with the `Smoother Step`, or no interpolation at
    all.
  videos:
    - https://imgur.com/m3BPUxh
Animate Value:
  description: >-
    Animate a float value between the specified min and max values, over specified range of frames. If clamped,
    frames above and below the start and end will result in the min and max output values, otherwise it will continue
    to linearly interpolate the value beyond the min and max values.
  videos:
    - https://imgur.com/2oOnwRm
Animate Trails:
  description: >-
    Add trails to the atoms as they are animated, which trail the specified number of frames behind the atoms
Animate Wiggle:
  description: >-
    Create a procedural animation of side-chain movement. 'Wiggles' the side-chains of peptide amino acids based
    on the `b_factor` attribute. Wiggle is currently only supported for protein side-chains and does not check for
    steric clashing so higher amplitudes will result in strange results. The animation should seamlessly loop every
    `1.00` of the `Animate 0..1` input.
  videos:
    - https://imgur.com/GK1nyUz
Animate Peptide to Curve:
  description: >-
    Take the protein residues from a structure and align then along an input curve. Editing the curve will change
    how the atoms are arranged. The output atoms can be styled as normal.
  videos:
    - https://imgur.com/FcEXSZx
Field Remap:
  description: Sample a field from the mesh and remap from the minimum to the maximum to the specified values
Angstrom to World: {}
World to Angstrom: {}
Between Integer:
  description: Test if an integer is between (and including) the upper and lower bounds
Between Float:
  description: Test if a float is between the upper and lower bounds
Between Vector:
  description: Test if a vector is element-wise between the upper and lower bounds.
Vector from Point:
  description: Calculate the vector from the current point's position to the input vector
Fractionate Float:
  description: Split a float into the floor, ceiling and fraction of `Value`
Rotation from ZYZ:
  description: Combine a rotation defined as `ZYZ`,common in electron tomography
Transform Relative:
  description: The transform to get from B to A, relative to the CB axis
Transform Mix:
  description: Mix between two transforms, controlling the translation, rotation and scale independently
Transform Local: {}
Transform Local Axis:
  description: >-
    Create a transform that is rotation around an axis in local space, with local space defined by the origin point
    which defaults to Position
Transform Accumulate:
  description: Accumulate transforms on the domain if selected
Transform Accumulate Point:
  description: Accumulate transforms on a domain, applying these transforms to the Position
Accumulate Axis Rotation:
  description: >-
    Accumulate transforms that are rotations around an axis in local space. The axis is defined by the current `Position`
    to the position of the last `True` point for the `Pivot` input.
Centroid:
  description: >-
    Calculate the centroid point for the selection for each group in the `Group ID`. The centroid is the average
    position of all points in each `Group ID`. If a selection is given, then only the selected points contribute
    towards the overall centroid calculation, but the result is still available on the other points in the `Group
    ID`
  videos:
    - https://imgur.com/Cc538lr
Vector Direction:
  description: Direction from one point to another, optionally normalized
Vector Angle:
  description: Compute the angle in radians between two vectors.
Dihedral Angle:
  description: >-
    Computes the angle between two vectors, AB & CD around around the axis of BC. The first vector AB is treated
    as the "12 O'clock" up position, looking down the axis towards C, with angles being return in the range of (-Pi,
    Pi). Clockwise angles are positive and anti-clockwise angles are negative.
Sample Nearest Atoms:
  description: >-
    Sample the nearest atoms from another object, to get the colors or other attributes and apply them to a volume
    mesh.
  videos:
    - https://imgur.com/UzNwLv2
