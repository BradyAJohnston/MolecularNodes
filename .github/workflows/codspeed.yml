name: CodSpeed Benchmarks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["*"]
  # allows CodSpeed to trigger backtest performance analysis to generate initial data
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    env:
      # CodSpeed's tracing needs the Python from actions/setup-python, not one
      # downloaded by uv
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Install molecularnodes
        run: |
          uv sync --all-extras

      # built outside the benchmark run so it isn't measured
      - name: Build node assets
        timeout-minutes: 10
        run: |
          uv run -m nodebpy.assets build

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: uv run --no-sync pytest benchmarks --codspeed
