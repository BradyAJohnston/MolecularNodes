name: Docs

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["*"]
    # publishing a release deploys the docs to GitHub Pages
    release:
        types: [published]
    workflow_dispatch:

# Cancel in-progress runs when a new workflow with the same group is triggered
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    docs:
        name: Build Documentation
        # the self-hosted runner only builds the docs for the maintainer's own pull
        # requests (and pushes and releases); other pull requests build on a
        # GitHub-hosted runner, with a single render sample to keep the build
        # within time: there the docs are checked to build, not to look good
        runs-on: macos-latest
        timeout-minutes: 120
        env:
            MN_MAX_RENDER_SAMPLES: "1"
        permissions: write-all
        steps:
            - uses: actions/checkout@v5
            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                  version: "latest"

            - name: Install Packages
              run: |
                  uv sync --all-extras

            - name: Build node assets
              timeout-minutes: 10
              run: |
                  uv run -m nodebpy.assets build

            - name: Pre-render Scripts
              timeout-minutes: 3
              run: |
                  uv run docs/generate.py
            - name: Build quartodoc
              run: |
                  cd docs
                  uv run quartodoc build
                  uv run quartodoc interlinks
                  cd ..

            - name: Biotite Setup CCD
              run: |
                  uv run python -m biotite.setup_ccd

            - name: Quarto Render Docs
              run: |
                  uv run quarto render docs

            - name: Configure pull release name
              if: ${{github.event_name == 'pull_request'}}
              run: |
                  echo "RELEASE_NAME=pr-${PR_NUMBER}" >> $GITHUB_ENV
              env:
                  PR_NUMBER: ${{ github.event.number }}
            - name: Configure branch release name
              if: ${{github.event_name != 'pull_request'}}
              run: |
                  # use branch name, but replace slashes. E.g. feat/a -> feat-a
                  echo "RELEASE_NAME=${GITHUB_REF_NAME/\//-}" >> $GITHUB_ENV
            # deploy ----
            - name: Create Github Deployment
              uses: bobheadxi/deployments@v0.4.3
              if: github.event.pull_request.head.repo.full_name == github.repository
              id: deployment
              with:
                  step: start
                  token: ${{ secrets.GITHUB_TOKEN }}
                  env: ${{ env.RELEASE_NAME }}
                  ref: ${{ github.head_ref }}
                  transient: true
                  logs: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            - name: Netlify docs preview
              if: github.event.pull_request.head.repo.full_name == github.repository
              run: |
                  npm install -g netlify-cli
                  # push main branch to production, others to preview --
                  if [ "${ALIAS}" == "main" ]; then
                    netlify deploy --dir=docs/_build --alias="main"
                  else
                    netlify deploy --dir=docs/_build --alias="${ALIAS}"
                  fi
              env:
                  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
                  ALIAS: ${{ steps.deployment.outputs.env }}

            - name: Update Github Deployment
              if: github.event.pull_request.head.repo.full_name == github.repository
              uses: bobheadxi/deployments@v0.4.3
              with:
                  step: finish
                  token: ${{ secrets.GITHUB_TOKEN }}
                  status: ${{ job.status }}
                  deployment_id: ${{ steps.deployment.outputs.deployment_id }}
                  env_url: "https://${{ steps.deployment.outputs.env }}--molecularnodes.netlify.app"
                  logs: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            - name: Deploy Release Documentation
              uses: peaceiris/actions-gh-pages@v4
              if: github.event_name == 'release'
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: docs/_build
