name: Build

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["*"]
    workflow_dispatch:

# Cancel in-progress runs when a new workflow with the same group is triggered
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build Extension
        runs-on: macos-latest
        strategy:
            matrix:
                version: [latest]
        env:
            ADDON_NAME: molecularnodes
        steps:
            - uses: actions/checkout@v5
            - uses: SebRollen/toml-action@v1.2.0
              id: read_manifest
              with:
                  file: "pyproject.toml"
                  field: "project.version"
            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
            - uses: BradyAJohnston/setup-blender@v5
              with:
                  version: ${{ matrix.version }}
            - name: Build node assets
              run: |
                  uv sync --all-extras
                  uv run -m nodebpy.assets build
            - name: Build extension
              run: |
                  uvx extbpy build
                  mkdir artifact
                  mv ${{ env.ADDON_NAME }}-${{ steps.read_manifest.outputs.value }}-*.zip ./artifact/.
            - name: Upload extension artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.ADDON_NAME }}-${{ github.sha }}
                  retention-days: 7
                  path: ./artifact/*
